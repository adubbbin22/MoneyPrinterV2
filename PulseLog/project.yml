# XcodeGen spec. Generates PulseLog.xcodeproj:
#
#   brew install xcodegen && xcodegen generate
#
# The project file is generated rather than committed so the build
# configuration stays reviewable in a diff instead of living in an opaque
# pbxproj that conflicts on every merge.

name: PulseLog
options:
  bundleIdPrefix: com.pulselog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  PulseLogPackage:
    path: .

targets:
  PulseLog:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          # Generated into place by the `info:` block below; including it as a
          # source would also copy it into the bundle as a stray resource.
          - "Resources/Info.plist"
          # Local StoreKit testing only. Shipping it would put placeholder
          # pricing inside the released app.
          - "Resources/PulseLog.storekit"
    dependencies:
      - package: PulseLogPackage
        product: PulseLogSignal
      - package: PulseLogPackage
        product: PulseLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulselog.app
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/PulseLog.entitlements
        # Camera PPG needs a rear camera and a torch, so there is no useful
        # iPad or simulator story. Portrait only: the measurement is done with
        # a finger on the back of the device.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        debug:
          # Points StoreKit at the local configuration so the paywall is
          # testable before products exist in App Store Connect.
          OTHER_SWIFT_FLAGS: "-D DEBUG"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: PulseLog
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Camera access is not optional for this app; without it there is
        # nothing to show.
        NSCameraUsageDescription: >-
          PulseLog uses the camera and flash to measure your pulse from your
          fingertip. No images are recorded or sent anywhere.
        NSHealthShareUsageDescription: >-
          PulseLog reads your sleep and step data to work out what affects your
          resting heart rate. This never leaves your device.
        NSHealthUpdateUsageDescription: >-
          PulseLog saves your heart rate and blood pressure readings to Apple
          Health so they sit alongside the rest of your health data.
        # Answers the export-compliance question at upload time. The app uses
        # only HTTPS and Apple's own encryption, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities:
          - arm64
          - still-camera
          - camera-flash
